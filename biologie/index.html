<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧬 Biologie</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; padding-top: 15px; }
        h1 { font-size: 2.2rem; color: white; text-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 8px; }
        .subtitle { color: rgba(255,255,255,0.85); font-size: 1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255,255,255,0.97);
            border-radius: 30px;
            padding: 30px 25px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.4);
            transition: transform 0.25s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--accent);
        }
        .card:hover { transform: translateY(-6px); }
        .card.skelett { --accent: linear-gradient(90deg, #667eea, #764ba2); }
        .icon { font-size: 3.5rem; }
        .title { font-size: 1.4rem; font-weight: bold; color: #333; }
        .subtitle-card { font-size: 0.85rem; color: #888; font-style: italic; }
        .desc { color: #666; font-size: 0.9rem; text-align: center; margin-top: 5px; }
        .back-link {
            display: inline-block;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-link">← Zurück zum Hauptmenü</a>
        <header>
            <h1>🧬 Biologie</h1>
            <div class="subtitle">Wähle ein Thema / Elige un tema</div>
        </header>
        <div class="grid">
            <a href="skelett/" class="card skelett">
                <div class="icon">🦴</div>
                <div class="title">Skelett beschriften</div>
                <div class="subtitle-card">Etiqueta el esqueleto</div>
                <div class="desc">Aprende los huesos en alemán con audio</div>
            </a>
        </div>
    </div>
    <script>
        // Monitoreo de uso
        (function() {
            fetch('https://script.google.com/macros/s/AKfycbysVdG5UKMZmMJe7RdL3cEA6nt-V5xs03T4uwnoaeHYKFt_8Bo2AvclGWuxUM-Wd1Md/exec', {
               method: 'POST',
               mode: 'no-cors',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({
                   pagina: window.location.pathname || '/',
                   dispositivo: /iPhone|iPad|Android/i.test(navigator.userAgent) ? 'Móvil' : 'Escritorio'
               })
            }).catch(function() { /* silencioso si falla */ });
         })();
     </script>
</body>
</html>
