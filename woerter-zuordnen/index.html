<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Emparejar Vocabulario - Deutsch/Spanisch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 15px;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255,255,255,0.97);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            font-size: 1.7rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Carga de lista */
        .load-area {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .load-area textarea {
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 90px;
            margin-bottom: 10px;
            -webkit-appearance: none;
        }

        .load-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            -webkit-appearance: none;
            min-height: 46px;
        }

        button:active { transform: scale(0.96); }

        .btn-primary { background: #667eea; color: white; flex: 1; }
        .btn-file {
            background: #3b82f6; color: white; flex: 1;
            text-align: center; cursor: pointer;
        }
        .btn-validate { background: #10b981; color: white; }
        .btn-reset { background: #f59e0b; color: white; }
        .btn-export { background: #dc2626; color: white; }
        .btn-speak-small {
            background: #059669;
            color: white;
            padding: 6px 10px;
            font-size: 0.9rem;
            min-height: auto;
            border-radius: 12px;
        }

        /* Info bar */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e5e7eb;
            padding: 12px 18px;
            border-radius: 15px;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-bar span {
            font-weight: bold;
            font-size: 0.9rem;
            color: #333;
        }

        .score-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* Tabla de emparejamiento */
        .matching-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .column-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            margin-bottom: 12px;
            text-align: center;
        }

        .column-title.es {
            border-bottom-color: #f59e0b;
        }

        /* Columna alemana */
        .de-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f9fafb;
            padding: 12px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 2px solid #e5e7eb;
            transition: all 0.2s;
        }

        .de-number {
            background: #667eea;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .de-word {
            flex: 1;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            word-break: break-word;
        }

        /* Columna española */
        .es-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fffbeb;
            padding: 12px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            border: 2px solid #e5e7eb;
            transition: all 0.2s;
        }

        .es-input {
            width: 50px;
            height: 42px;
            padding: 0;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            border: 2px solid #f59e0b;
            border-radius: 12px;
            -webkit-appearance: none;
            flex-shrink: 0;
        }

        .es-input:focus {
            outline: none;
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.2);
        }

        .es-word {
            flex: 1;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            word-break: break-word;
        }

        /* Estados de resultado */
        .de-item.correct, .es-item.correct {
            border-color: #10b981;
            background: #f0fdf4;
        }

        .de-item.incorrect, .es-item.incorrect {
            border-color: #ef4444;
            background: #fef2f2;
        }

        /* Barra de acciones */
        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .action-bar button {
            flex: 1;
            min-width: 130px;
        }

        /* Estado */
        .status {
            background: #f3f4f6;
            padding: 14px;
            border-radius: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 15px;
        }

        .status.success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            font-weight: bold;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Historial / errores */
        .errors-list {
            background: #f9fafb;
            border-radius: 20px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .errors-list.show {
            display: block;
        }

        .errors-list h3 {
            font-size: 1rem;
            color: #991b1b;
            margin-bottom: 10px;
        }

        .error-item {
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.85rem;
        }

        .error-item:last-child {
            border-bottom: none;
        }

        .error-item strong {
            color: #dc2626;
        }

        @media (max-width: 600px) {
            .matching-grid {
                gap: 10px;
            }
            .de-word, .es-word {
                font-size: 0.85rem;
            }
            .de-number {
                width: 28px;
                height: 28px;
                font-size: 0.85rem;
            }
            .es-input {
                width: 42px;
                height: 38px;
                font-size: 1rem;
            }
            .column-title {
                font-size: 0.75rem;
            }
            h1 { font-size: 1.4rem; }
            .btn-speak-small {
                padding: 5px 8px;
                font-size: 0.8rem;
            }
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(15px, env(safe-area-inset-left));
                padding-right: max(15px, env(safe-area-inset-right));
                padding-bottom: max(15px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="card">
        <h1>🎯 Emparejar Vocabulario</h1>
        <div class="subtitle">🇩🇪 Alemán ↔ 🇪🇸 Español</div>

        <!-- Carga de lista -->
        <div class="load-area">
            <textarea id="wordPasteArea" placeholder="Pega tu lista, una por línea:&#10;Haus|casa&#10;Baum|árbol&#10;Wasser|agua"></textarea>
            <div class="load-buttons">
                <button class="btn-primary" id="pasteBtn">📋 Cargar lista</button>
                <label class="btn-file" for="fileInput">📁 Archivo</label>
                <input type="file" id="fileInput" accept=".txt" style="display:none;">
            </div>
        </div>

        <div class="info-bar">
            <span id="totalInfo">📚 Sin palabras cargadas</span>
            <span class="score-badge" id="scoreBadge">0 / 0 correctas</span>
        </div>

        <div class="status" id="statusMsg">
            💡 Carga tu lista para comenzar
        </div>

        <!-- Tabla de emparejamiento -->
        <div class="matching-grid" id="matchingGrid" style="display:none;">
            <div>
                <div class="column-title">🇩🇪 Alemán</div>
                <div id="deColumn"></div>
            </div>
            <div>
                <div class="column-title es">🇪🇸 Español</div>
                <div id="esColumn"></div>
            </div>
        </div>

        <!-- Acciones -->
        <div class="action-bar">
            <button class="btn-validate" id="validateBtn">✅ Validar respuestas</button>
            <button class="btn-reset" id="resetBtn">🔄 Reiniciar</button>
            <button class="btn-export" id="exportBtn">📤 Exportar fallos</button>
        </div>

        <!-- Lista de errores -->
        <div class="errors-list" id="errorsList">
            <h3>❌ Errores en esta ronda</h3>
            <div id="errorsContent"></div>
        </div>
    </div>

</div>

<script>
    // ============================================
    // ESTADO
    // ============================================
    let wordList = [];             // [{de, es}]
    let currentPairs = [];         // [{de, es, esPosition}] en la ronda actual
    let lastErrors = [];           // [{de, es}]
    let currentRound = 1;

    // Elementos DOM
    const wordPasteArea = document.getElementById('wordPasteArea');
    const totalInfo = document.getElementById('totalInfo');
    const scoreBadge = document.getElementById('scoreBadge');
    const statusMsg = document.getElementById('statusMsg');
    const matchingGrid = document.getElementById('matchingGrid');
    const deColumn = document.getElementById('deColumn');
    const esColumn = document.getElementById('esColumn');
    const errorsList = document.getElementById('errorsList');
    const errorsContent = document.getElementById('errorsContent');

    // ============================================
    // UTILIDADES
    // ============================================
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function normalize(text) {
        return text.toString().trim().toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/ß/g, 'ss')
            .replace(/\s+/g, ' ');
    }

    // ============================================
    // CARGAR LISTA
    // ============================================
    function parseLine(line) {
        const trimmed = line.trim();
        if (!trimmed) return null;

        let parts;
        if (trimmed.includes('|')) parts = trimmed.split('|');
        else if (trimmed.includes('\t')) parts = trimmed.split('\t');
        else if (trimmed.includes(' - ')) parts = trimmed.split(' - ');
        else return { de: trimmed, es: '' };

        const de = (parts[0] || '').trim();
        const es = (parts[1] || '').trim();
        if (!de || !es) return null;
        return { de, es };
    }

    function loadWords(text) {
        const lines = text.split(/\r?\n/);
        const parsed = lines.map(parseLine).filter(w => w && w.de && w.es);

        const seen = new Set();
        const unique = [];
        for (const w of parsed) {
            const key = w.de.toLowerCase();
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(w);
            }
        }

        if (unique.length < 2) {
            alert('Necesitas al menos 2 pares de palabras válidos (alemán|español).');
            return;
        }

        wordList = unique;
        totalInfo.textContent = `📚 ${wordList.length} pares cargados`;
        statusMsg.textContent = `✅ Listo. ${wordList.length} pares para emparejar.`;
        statusMsg.className = 'status';
        errorsList.classList.remove('show');

        startRound();
    }

    // ============================================
    // INICIAR RONDA
    // ============================================
    function startRound() {
        // Alemanas en orden aleatorio + asignar número del 1 al N
        const shuffledDe = shuffle(wordList);
        // Españolas en orden aleatorio distinto
        const shuffledEs = shuffle(wordList);

        currentPairs = shuffledDe.map((pair, idx) => ({
            number: idx + 1,
            de: pair.de,
            es: pair.es
        }));

        // Renderizar columnas
        renderDeColumn();
        renderEsColumn(shuffledEs);

        matchingGrid.style.display = 'grid';
        errorsList.classList.remove('show');
        errorsContent.innerHTML = '';
        updateScore();
    }

    function renderDeColumn() {
        deColumn.innerHTML = currentPairs.map(pair => `
            <div class="de-item" data-de="${escapeHtml(pair.de)}">
                <div class="de-number">${pair.number}</div>
                <div class="de-word">${escapeHtml(pair.de)}</div>
                <button class="btn-speak-small" data-speak="${escapeHtml(pair.de)}" title="Pronunciar">🔊</button>
            </div>
        `).join('');

        // Eventos para los botones de pronunciación
        deColumn.querySelectorAll('.btn-speak-small').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const text = btn.getAttribute('data-speak');
                speakGerman(text);
            });
        });
    }

    function renderEsColumn(shuffledEs) {
        esColumn.innerHTML = shuffledEs.map(pair => `
            <div class="es-item" data-es="${escapeHtml(pair.es)}">
                <input type="number" class="es-input" min="1" max="${currentPairs.length}" inputmode="numeric" placeholder="#">
                <div class="es-word">${escapeHtml(pair.es)}</div>
            </div>
        `).join('');

        // Enter salta al siguiente input
        const inputs = esColumn.querySelectorAll('.es-input');
        inputs.forEach((input, i) => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const next = inputs[i + 1];
                    if (next) next.focus();
                    else validate();
                }
            });
        });
    }

    // ============================================
    // VALIDAR
    // ============================================
    function validate() {
        if (currentPairs.length === 0) return;

        const esItems = esColumn.querySelectorAll('.es-item');
        let correctCount = 0;
        const errors = [];

        // Construir mapa: es -> número correcto
        const esToNumber = {};
        currentPairs.forEach(p => {
            esToNumber[normalize(p.es)] = p.number;
        });

        esItems.forEach(item => {
            const esWord = item.getAttribute('data-es');
            const input = item.querySelector('.es-input');
            const deItem = deColumn.querySelector(`.de-item[data-de="${CSS.escape(currentPairs.find(p => p.es === esWord)?.de || '')}"]`);

            const userNum = parseInt(input.value, 10);
            const correctNum = esToNumber[normalize(esWord)];

            // Limpiar clases previas
            item.classList.remove('correct', 'incorrect');
            if (deItem) deItem.classList.remove('correct', 'incorrect');

            if (userNum === correctNum) {
                item.classList.add('correct');
                if (deItem) deItem.classList.add('correct');
                correctCount++;
            } else {
                item.classList.add('incorrect');
                if (deItem) deItem.classList.add('incorrect');
                errors.push({
                    de: currentPairs.find(p => p.es === esWord)?.de || '',
                    es: esWord,
                    userNum: isNaN(userNum) ? '—' : userNum,
                    correctNum: correctNum
                });
            }
        });

        updateScore(correctCount, currentPairs.length);

        if (correctCount === currentPairs.length) {
            statusMsg.textContent = `🎉 ¡PERFECTO! ${correctCount}/${currentPairs.length} correctas. ¡Puedes continuar!`;
            statusMsg.className = 'status success';
            errorsList.classList.remove('show');
            lastErrors = [];

            // Botón cambia a "Siguiente ronda"
            const btn = document.getElementById('validateBtn');
            btn.textContent = '➡️ Siguiente ronda';
            btn.onclick = () => {
                // Restaurar botón
                btn.textContent = '✅ Validar respuestas';
                btn.onclick = validate;
                currentRound++;
                startRound();
            };
        } else {
            statusMsg.textContent = `❌ ${correctCount}/${currentPairs.length} correctas. ¡Intenta de nuevo!`;
            statusMsg.className = 'status error';

            // Guardar errores y mostrarlos
            lastErrors = errors;
            showErrors(errors);
        }
    }

    function showErrors(errors) {
        if (errors.length === 0) {
            errorsList.classList.remove('show');
            return;
        }

        errorsContent.innerHTML = errors.map(e => `
            <div class="error-item">
                <strong>${escapeHtml(e.de)}</strong> = ${escapeHtml(e.es)}
                <br>
                <small>Pusiste: <strong>${e.userNum}</strong> | Correcto: <strong>${e.correctNum}</strong></small>
            </div>
        `).join('');
        errorsList.classList.add('show');
    }

    function updateScore(correct = 0, total = currentPairs.length) {
        scoreBadge.textContent = `${correct} / ${total} correctas`;
    }

    // ============================================
    // PRONUNCIACIÓN
    // ============================================
    function speakGerman(text) {
        if (!('speechSynthesis' in window)) return;

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.rate = 0.85;

        const voices = window.speechSynthesis.getVoices();
        const germanVoice = voices.find(v => v.lang === 'de-DE' || v.lang.startsWith('de'));
        if (germanVoice) utterance.voice = germanVoice;

        window.speechSynthesis.speak(utterance);
        statusMsg.textContent = `🔊 Pronunciando: ${text}`;
        statusMsg.className = 'status';
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        window.speechSynthesis.getVoices();
    }

    // ============================================
    // RESET
    // ============================================
    function resetGame() {
        if (wordList.length === 0) {
            statusMsg.textContent = '⚠️ Carga una lista primero';
            return;
        }
        currentRound = 1;
        startRound();
        statusMsg.textContent = `🔄 Juego reiniciado`;
        statusMsg.className = 'status';
        // Restaurar botón
        const btn = document.getElementById('validateBtn');
        btn.textContent = '✅ Validar respuestas';
        btn.onclick = validate;
    }

    // ============================================
    // EXPORTAR ERRORES
    // ============================================
    function exportErrors() {
        if (lastErrors.length === 0) {
            alert('No hay errores para exportar. ¡Bien hecho!');
            return;
        }
        const content = lastErrors.map(e => `${e.de}|${e.es}`).join('\n');
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `errores_${new Date().toISOString().slice(0,10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        statusMsg.textContent = `📤 Exportados ${lastErrors.length} errores`;
    }

    // ============================================
    // EVENTOS
    // ============================================
    document.getElementById('pasteBtn').addEventListener('click', () => {
        const text = wordPasteArea.value;
        if (!text.trim()) {
            alert('Pega primero la lista de palabras.');
            return;
        }
        loadWords(text);
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            wordPasteArea.value = ev.target.result;
            loadWords(ev.target.result);
        };
        reader.readAsText(file, 'UTF-8');
    });

    document.getElementById('validateBtn').addEventListener('click', validate);
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    document.getElementById('exportBtn').addEventListener('click', exportErrors);
</script>
</body>
</html>
