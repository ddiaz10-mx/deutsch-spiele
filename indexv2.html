<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Vocabulario Deutsch-Spanisch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 15px;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: rgba(255,255,255,0.97);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .flag-flags {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        /* Carga de lista */
        .load-area {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .load-area textarea {
            width: 100%;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #ccc;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            min-height: 90px;
            margin-bottom: 10px;
            -webkit-appearance: none;
        }

        .load-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: inherit;
            -webkit-appearance: none;
            min-height: 48px;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #667eea;
            color: white;
            flex: 1;
        }

        .btn-file {
            background: #3b82f6;
            color: white;
            flex: 1;
            text-align: center;
            cursor: pointer;
        }

        /* Modo selector */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-btn {
            flex: 1;
            padding: 14px 10px;
            background: #e5e7eb;
            color: #374151;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 140px;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }

        /* Estadísticas */
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 18px;
            text-align: center;
        }

        .stat .label {
            font-size: 0.75rem;
            opacity: 0.9;
        }

        .stat .value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Tarjeta de palabra */
        .word-card {
            background: white;
            border: 3px solid #667eea;
            border-radius: 30px;
            padding: 35px 20px;
            margin-bottom: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .word-card.correct {
            border-color: #10b981;
            background: #f0fdf4;
        }

        .word-card.incorrect {
            border-color: #ef4444;
            background: #fef2f2;
        }

        .question-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-word {
            font-size: 2.2rem;
            font-weight: bold;
            color: #333;
            word-break: break-word;
            line-height: 1.3;
            margin-bottom: 10px;
        }

        .answer-feedback {
            font-size: 1rem;
            margin-top: 15px;
            padding: 10px;
            border-radius: 15px;
            min-height: 20px;
        }

        .answer-feedback.correct {
            background: #d1fae5;
            color: #065f46;
        }

        .answer-feedback.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Input */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-area input {
            flex: 1;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: 2px solid #667eea;
            border-radius: 50px;
            text-align: center;
            font-weight: bold;
            -webkit-appearance: none;
            min-height: 52px;
        }

        .input-area input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.15);
        }

        .input-area input:disabled {
            background: #f3f4f6;
        }

        .btn-check {
            background: #10b981;
            color: white;
            padding: 16px 24px;
        }

        /* Botones de acción */
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .action-buttons button {
            flex: 1;
            min-width: 130px;
            font-size: 0.9rem;
        }

        .btn-speak {
            background: #059669;
            color: white;
        }

        .btn-skip {
            background: #f59e0b;
            color: white;
        }

        .btn-reset {
            background: #6b7280;
            color: white;
        }

        .btn-export {
            background: #dc2626;
            color: white;
        }

        /* Estado */
        .status {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 15px;
        }

        .status.finished {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-weight: bold;
        }

        /* Historial */
        .history {
            background: #f9fafb;
            border-radius: 20px;
            padding: 15px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history h3 {
            font-size: 1rem;
            color: #333;
            margin-bottom: 10px;
        }

        .history-item {
            padding: 8px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .word {
            flex: 1;
            word-break: break-word;
        }

        .history-item .result-correct {
            color: #10b981;
            font-weight: bold;
        }

        .history-item .result-incorrect {
            color: #ef4444;
            font-weight: bold;
        }

        /* Info badge */
        .info-badge {
            background: #e5e7eb;
            padding: 10px;
            border-radius: 15px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* iPhone safe area */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(15px, env(safe-area-inset-left));
                padding-right: max(15px, env(safe-area-inset-right));
                padding-bottom: max(15px, env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 480px) {
            .question-word {
                font-size: 1.7rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .action-buttons button {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="card">
        <h1>🇩🇪 Vocabulario 🇪🇸</h1>
        <div class="subtitle">Alemán ↔ Español</div>
        <div class="flag-flags">🐝</div>

        <!-- Área de carga -->
        <div class="load-area">
            <textarea id="wordPasteArea" placeholder="Pega tu lista aquí, una por línea:&#10;Haus|casa&#10;Baum|árbol&#10;Wasser|agua"></textarea>
            <div class="load-buttons">
                <button class="btn-primary" id="pasteBtn">📋 Cargar lista</button>
                <label class="btn-file" for="fileInput">📁 Archivo</label>
                <input type="file" id="fileInput" accept=".txt" style="display:none;">
            </div>
        </div>

        <div class="info-badge" id="totalInfo">
            📚 Carga tu lista para comenzar
        </div>

        <!-- Selector de modo -->
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="es-to-de">
                🇪🇸 → 🇩🇪<br><small>Ver español, escribir alemán</small>
            </button>
            <button class="mode-btn" data-mode="de-to-es">
                🇩🇪 → 🇪🇸<br><small>Ver alemán, escribir español</small>
            </button>
        </div>

        <!-- Estadísticas -->
        <div class="stats">
            <div class="stat">
                <div class="label">✅ Aciertos</div>
                <div class="value" id="correctCount">0</div>
            </div>
            <div class="stat">
                <div class="label">❌ Errores</div>
                <div class="value" id="incorrectCount">0</div>
            </div>
            <div class="stat">
                <div class="label">📝 Restantes</div>
                <div class="value" id="remainingCount">0</div>
            </div>
        </div>

        <!-- Tarjeta de palabra -->
        <div class="word-card" id="wordCard">
            <div class="question-label" id="questionLabel">🇪🇸 Español</div>
            <div class="question-word" id="questionWord">📚 Carga una lista</div>
            <div class="answer-feedback" id="answerFeedback"></div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe aquí..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
            <button class="btn-check" id="checkBtn">✅</button>
        </div>

        <!-- Botones de acción -->
        <div class="action-buttons">
            <button class="btn-speak" id="speakBtn">🔊 Pronunciar</button>
            <button class="btn-skip" id="skipBtn">⏭️ Saltar</button>
            <button class="btn-reset" id="resetBtn">🔄 Reiniciar</button>
            <button class="btn-export" id="exportBtn">📤 Errores</button>
        </div>

        <!-- Estado -->
        <div class="status" id="statusMsg">
            💡 Pega tu lista de palabras en la parte superior
        </div>

        <!-- Historial -->
        <div class="history">
            <h3>📜 Historial reciente</h3>
            <div id="historyList">Aún no hay respuestas...</div>
        </div>
    </div>

</div>

<script>
    // ============================================
    // ESTADO
    // ============================================
    let wordList = [];           // [{ de, es }]
    let remaining = [];          // palabras por preguntar
    let currentWord = null;      // { de, es }
    let correct = [];
    let incorrect = [];
    let mode = 'es-to-de';       // 'es-to-de' o 'de-to-es'
    let answered = false;        // si ya respondió la actual

    // ============================================
    // ELEMENTOS DOM
    // ============================================
    const wordPasteArea = document.getElementById('wordPasteArea');
    const totalInfo = document.getElementById('totalInfo');
    const wordCard = document.getElementById('wordCard');
    const questionLabel = document.getElementById('questionLabel');
    const questionWord = document.getElementById('questionWord');
    const answerFeedback = document.getElementById('answerFeedback');
    const userInput = document.getElementById('userInput');
    const checkBtn = document.getElementById('checkBtn');
    const speakBtn = document.getElementById('speakBtn');
    const skipBtn = document.getElementById('skipBtn');
    const resetBtn = document.getElementById('resetBtn');
    const exportBtn = document.getElementById('exportBtn');
    const statusMsg = document.getElementById('statusMsg');
    const correctCountEl = document.getElementById('correctCount');
    const incorrectCountEl = document.getElementById('incorrectCount');
    const remainingCountEl = document.getElementById('remainingCount');
    const historyList = document.getElementById('historyList');

    // ============================================
    // UTILIDADES
    // ============================================
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Normalizar: sin mayúsculas, sin acentos, sin espacios extra
    function normalize(text) {
        return text
            .toString()
            .trim()
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')  // quitar tildes
            .replace(/ß/g, 'ss')              // ß → ss
            .replace(/\s+/g, ' ');            // espacios múltiples → 1
    }

    // ============================================
    // CARGAR LISTA
    // ============================================
    function parseLine(line) {
        const trimmed = line.trim();
        if (!trimmed) return null;

        // Formato: alemán|español  o  alemán - español
        let parts;
        if (trimmed.includes('|')) {
            parts = trimmed.split('|');
        } else if (trimmed.includes('\t')) {
            parts = trimmed.split('\t');
        } else if (trimmed.includes(' - ')) {
            parts = trimmed.split(' - ');
        } else {
            // Solo una palabra: la usamos como alemana sin traducción
            return { de: trimmed, es: '' };
        }

        const de = (parts[0] || '').trim();
        const es = (parts[1] || '').trim();
        if (!de) return null;
        return { de, es };
    }

    function loadWords(text) {
        const lines = text.split(/\r?\n/);
        const parsed = lines.map(parseLine).filter(w => w && w.de);

        // Eliminar duplicados por alemán
        const seen = new Set();
        const unique = [];
        for (const w of parsed) {
            const key = w.de.toLowerCase();
            if (!seen.has(key)) {
                seen.add(key);
                unique.push(w);
            }
        }

        if (unique.length === 0) {
            alert('No se encontraron palabras válidas. Revisa el formato.');
            return;
        }

        wordList = shuffle(unique);
        remaining = [...wordList];
        correct = [];
        incorrect = [];
        currentWord = null;
        answered = false;

        totalInfo.textContent = `📚 ${wordList.length} palabras cargadas`;
        statusMsg.textContent = `✅ Listo. ${wordList.length} palabras para practicar.`;
        statusMsg.classList.remove('finished');

        updateStats();
        updateHistory();
        nextWord();
    }

    // ============================================
    // SIGUIENTE PALABRA
    // ============================================
    function nextWord() {
        answered = false;
        answerFeedback.textContent = '';
        answerFeedback.className = 'answer-feedback';
        wordCard.classList.remove('correct', 'incorrect');
        userInput.value = '';
        userInput.disabled = false;

        if (remaining.length === 0) {
            currentWord = null;
            questionWord.textContent = '🎉 ¡Terminaste!';
            questionLabel.textContent = '';
            userInput.disabled = true;
            statusMsg.textContent = `🏆 ¡Completado! Aciertos: ${correct.length} | Errores: ${incorrect.length}`;
            statusMsg.classList.add('finished');
            return;
        }

        const idx = Math.floor(Math.random() * remaining.length);
        currentWord = remaining[idx];

        if (mode === 'es-to-de') {
            questionLabel.textContent = '🇪🇸 Español → escribe en 🇩🇪 Alemán';
            questionWord.textContent = currentWord.es || currentWord.de;
        } else {
            questionLabel.textContent = '🇩🇪 Alemán → escribe en 🇪🇸 Español';
            questionWord.textContent = currentWord.de;
        }

        // Enfocar input en móviles
        if (window.innerWidth > 400) {
            setTimeout(() => userInput.focus(), 100);
        }
    }

    // ============================================
    // VERIFICAR RESPUESTA
    // ============================================
    function checkAnswer() {
        if (!currentWord || answered) return;

        const userAns = normalize(userInput.value);
        if (!userAns) {
            statusMsg.textContent = '⚠️ Escribe una respuesta primero';
            return;
        }

        let expected;
        if (mode === 'es-to-de') {
            expected = normalize(currentWord.de);
        } else {
            expected = normalize(currentWord.es);
        }

        if (!expected) {
            // No hay traducción para comparar
            answerFeedback.textContent = 'ℹ️ Esta palabra no tiene traducción. Saltando...';
            answerFeedback.className = 'answer-feedback';
            setTimeout(() => {
                skipWord();
            }, 1200);
            return;
        }

        const isCorrect = userAns === expected;

        if (isCorrect) {
            correct.push(currentWord);
            wordCard.classList.add('correct');
            answerFeedback.textContent = `✅ ¡Correcto! ${currentWord.de} = ${currentWord.es}`;
            answerFeedback.className = 'answer-feedback correct';
            statusMsg.textContent = `✅ ¡Bien hecho!`;
        } else {
            incorrect.push(currentWord);
            wordCard.classList.add('incorrect');
            const correctAnswer = mode === 'es-to-de' ? currentWord.de : currentWord.es;
            answerFeedback.textContent = `❌ Incorrecto. Respuesta: ${correctAnswer}`;
            answerFeedback.className = 'answer-feedback incorrect';
            statusMsg.textContent = `❌ La respuesta correcta era: ${correctAnswer}`;
        }

        // Remover de remaining
        const idx = remaining.indexOf(currentWord);
        if (idx !== -1) remaining.splice(idx, 1);

        answered = true;
        userInput.disabled = true;
        updateStats();
        updateHistory();

        // Auto-siguiente después de 2 segundos
        setTimeout(() => {
            if (answered) nextWord();
        }, 2000);
    }

    function skipWord() {
        if (!currentWord || answered) return;
        incorrect.push(currentWord);
        const idx = remaining.indexOf(currentWord);
        if (idx !== -1) remaining.splice(idx, 1);
        answered = true;
        updateStats();
        updateHistory();
        nextWord();
    }

    // ============================================
    // ESTADÍSTICAS E HISTORIAL
    // ============================================
    function updateStats() {
        correctCountEl.textContent = correct.length;
        incorrectCountEl.textContent = incorrect.length;
        remainingCountEl.textContent = remaining.length;
    }

    function updateHistory() {
        const all = [];
        correct.forEach(w => all.push({ ...w, result: 'correct' }));
        incorrect.forEach(w => all.push({ ...w, result: 'incorrect' }));

        if (all.length === 0) {
            historyList.innerHTML = 'Aún no hay respuestas...';
            return;
        }

        // Últimas 10
        const recent = all.slice(-10).reverse();
        historyList.innerHTML = recent.map(item => `
            <div class="history-item">
                <span class="word">${escapeHtml(item.de)} = ${escapeHtml(item.es)}</span>
                <span class="result-${item.result}">${item.result === 'correct' ? '✅' : '❌'}</span>
            </div>
        `).join('');
    }

    // ============================================
    // PRONUNCIACIÓN (iPhone compatible)
    // ============================================
    function speakCurrent() {
        if (!currentWord) {
            statusMsg.textContent = '⚠️ No hay palabra activa';
            return;
        }
        if (!('speechSynthesis' in window)) {
            statusMsg.textContent = '❌ Tu navegador no soporta pronunciación';
            return;
        }

        // Cancelar cualquier pronunciación previa
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(currentWord.de);
        utterance.lang = 'de-DE';
        utterance.rate = 0.85;
        utterance.pitch = 1;
        utterance.volume = 1;

        // iOS: forzar voces alemanas si están disponibles
        const voices = window.speechSynthesis.getVoices();
        const germanVoice = voices.find(v => v.lang === 'de-DE' || v.lang.startsWith('de'));
        if (germanVoice) {
            utterance.voice = germanVoice;
        }

        window.speechSynthesis.speak(utterance);
        statusMsg.textContent = `🔊 Pronunciando: ${currentWord.de}`;
    }

    // Cargar voces al inicio (iOS las carga async)
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
            // Forzar carga
            window.speechSynthesis.getVoices();
        };
        window.speechSynthesis.getVoices();
    }

    // ============================================
    // RESET Y EXPORTAR
    // ============================================
    function resetGame() {
        if (wordList.length === 0) {
            statusMsg.textContent = '⚠️ Carga una lista primero';
            return;
        }
        remaining = shuffle([...wordList]);
        correct = [];
        incorrect = [];
        currentWord = null;
        answered = false;
        statusMsg.textContent = '🔄 Juego reiniciado';
        statusMsg.classList.remove('finished');
        updateStats();
        updateHistory();
        nextWord();
    }

    function exportErrors() {
        if (incorrect.length === 0) {
            alert('No hay errores para exportar. ¡Bien hecho!');
            return;
        }

        const content = incorrect.map(w => `${w.de}|${w.es}`).join('\n');
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `errores_${new Date().toISOString().slice(0,10)}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        statusMsg.textContent = `📤 Exportados ${incorrect.length} errores`;
    }

    // ============================================
    // EVENTOS
    // ============================================
    document.getElementById('pasteBtn').addEventListener('click', () => {
        const text = wordPasteArea.value;
        if (!text.trim()) {
            alert('Pega primero la lista de palabras.');
            return;
        }
        loadWords(text);
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            wordPasteArea.value = ev.target.result;
            loadWords(ev.target.result);
        };
        reader.readAsText(file, 'UTF-8');
    });

    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            mode = btn.getAttribute('data-mode');
            statusMsg.textContent = `🎯 Modo: ${mode === 'es-to-de' ? 'Español → Alemán' : 'Alemán → Español'}`;
            // Reiniciar con el nuevo modo
            if (wordList.length > 0) {
                resetGame();
            }
        });
    });

    checkBtn.addEventListener('click', checkAnswer);
    speakBtn.addEventListener('click', speakCurrent);
    skipBtn.addEventListener('click', skipWord);
    resetBtn.addEventListener('click', resetGame);
    exportBtn.addEventListener('click', exportErrors);

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            checkAnswer();
        }
    });
</script>
</body>
</html>
